<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkspire Studio</title>
<meta name="description" content="Inkspire Studio makes Morph Launcher for Android.">
<link rel="canonical" href="https://inkspire-studio.net/">
<link rel="stylesheet" href="morph/site.css">
<style>
  .studio { min-height: 100vh; display: flex; flex-direction: column; }
  .studio main { flex: 1; display: flex; align-items: center; }
  .studio h1 { font-size: clamp(2.4rem, 6vw, 3.6rem); margin: 0 0 1rem; font-weight: 800; }
  .studio .lead { margin-bottom: 2.5rem; }
  .app { display: grid; grid-template-columns: 6rem 1fr; gap: 1.5rem; align-items: center; text-decoration: none; }
  .app .device { padding: 4%; border-radius: 1rem; }
  .app .device img { border-radius: .7rem; }
  .app h2 { font-size: 1.5rem; margin: 0 0 .3rem; }
  .app p { margin: 0; color: var(--muted); }
</style>
</head>
<body class="studio">

<main>
  <div class="wrap narrow">
    <h1>Inkspire Studio</h1>
    <p class="lead">We make apps for Android.</p>
    <a class="card app" href="morph/">
      <div class="device"><img src="morph/img/phone-home.webp" width="720" height="1280" alt=""></div>
      <div>
        <h2>Morph Launcher</h2>
        <p>Design your own home screen: icons, wallpapers, widgets and layouts.</p>
      </div>
    </a>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>Inkspire Studio</span>
    <nav aria-label="Footer">
      <a href="morph/privacy-policy.html">Morph Launcher privacy policy</a>
      <a href="mailto:inkspirestudio.support@gmail.com">inkspirestudio.support@gmail.com</a>
    </nav>
  </div>
</footer>

</body>
</html>
